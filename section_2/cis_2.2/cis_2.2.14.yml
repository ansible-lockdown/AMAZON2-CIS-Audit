---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_2_2_14 }}
    {{ if not .Vars.amazon2cis_net_snmp_server }}
package:
  snmp_pkg:
    title: 2.2.14 | Ensure snmp services are not in use | pkg removed
    name: net-snmp
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.2.14
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.amazon2cis_net_snmp_mask }}
file:
  snmp_service_masked:
    title: 2.2.14 | Ensure snmp services are not in use | masked
    path: /etc/systemd/system/snmpd.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.2.14
      NIST800-53R5:
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
