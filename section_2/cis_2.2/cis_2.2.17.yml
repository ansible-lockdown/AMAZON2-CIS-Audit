---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_2_2_17 }}
    {{ if not .Vars.amazon2cis_squid_server }}
package:
  squid_pkg:
    title: 2.2.17 | Ensure web proxy server services are not in use | pkg removed
    name: squid
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.2.17
      NIST800-53R5:
      - CM-6
      - CM-7
      {{ end }}
      {{ if .Vars.amazon2cis_squid_mask }}
file:
  squid_service_masked:
    title: 2.2.17 | Ensure web proxy server services are not in use | masked
    path: /etc/systemd/system/squid.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.2.17
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
