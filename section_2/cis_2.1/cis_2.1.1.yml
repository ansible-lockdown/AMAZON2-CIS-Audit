---

# CIS for Chrony
{{ if eq .Vars.amazon2cis_time_synchronization "chrony" }}
  {{ if .Vars.amazon2cis_level_1 }}
    {{ if .Vars.amazon2cis_rule_2_1_1 }}
package:
  chrony:
    title: 2.1.1 | Ensure time synchronization is in use
    installed: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.1
      NIST800-53R5:
      - AU-3
      - AU-12
service:
  chronyd:
    title: 2.1.1 | Ensure time synchronization is in use | running
    enabled: true
    running: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.2
      NIST800-53R5:
      - AU-3
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
