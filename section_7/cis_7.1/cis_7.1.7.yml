---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_7_1_7 }}
file:
  /etc/gshadow:
    title: 7.1.7 | Ensure access to /etc/gshadow is configured
    exists: true
    path: /etc/gshadow
    mode: '0000'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.7
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}

