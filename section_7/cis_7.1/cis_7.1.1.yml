---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_7_1_1 }}
file:
  /etc/passwd_perms:
    title: 7.1.1 | Ensure access to /etc/passwd is configured
    exists: true
    path: /etc/passwd
    mode:
      or:
      - '0644'
      - '0640'
      - '0600'
      - '0400'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
