---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.audit_run_heavy_tests }}
    {{ if .Vars.amazon2cis_rule_7_1_12 }}
command:
  unowned_dirs:
    title: 7.1.12 | Ensure no files or directories without an owner and a group exist
    exec: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.12
      NIST800-53R5:
      - AC-3
      - MP-2
  no_ungrouped:
    title: 7.1.12 | Ensure no files or directories without an owner and a group exist
    exec: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup"
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.12
      NIST800-53R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
