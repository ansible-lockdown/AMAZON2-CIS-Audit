---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.audit_run_heavy_tests }}
    {{ if .Vars.amazon2cis_rule_7_1_13 }}
command:
  audit_suid_exec:
    title: 7.1.13 | Ensure SUID and SGID files are reviewed
    exec: df --local -P | awk \'{if (NR!=1) print $6}\' | xargs -I \'{}'' find \'{}\' -xdev -type f -perm -4000
    exit-status:
      or:
      - 0
      - 1
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.13
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      - AC-3
      - MP-2
  audit_sgid:
    title: 7.1.13 | Ensure SUID and SGID files are reviewed
    exec: df --local -P | awk \'{if (NR!=1) print $6}\' | xargs -I \'{}\' find \'{}\' -xdev -type f -perm -2000"
    timeout: {{ .Vars.timeout_ms }}
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.13
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
