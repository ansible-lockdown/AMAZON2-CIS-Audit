---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_2_3 }}
command:
  gid_0_groups_check:
    title: 5.5.2.3 | Ensure group root is the only GID 0 group
    exit-status: 0
    exec: |
      awk -F: '($3 == 0) { print $1 }' /etc/group | grep -wv root || true
    stdout: []
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.3
      NIST800-53R5:
      - CM-6
      - IA-5
  {{ end }}
{{ end }}
