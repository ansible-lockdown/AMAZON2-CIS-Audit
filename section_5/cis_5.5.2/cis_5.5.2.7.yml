---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_2_7 }}
command:
  secure_system_accts:
    title: 5.5.2.7 | Ensure system accounts do not have a valid login shell
    exec: "/awk -F: '$3<1000' /etc/passwd | egrep -v 'root|sync|halt|shutdown|/sbin/nologin|/bin/false'/"
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.7
      NIST800-53R5:
      - AC-2(5)
      - AC-3
      - AC-11
      - MP-2
  secure_system_LK:
    title: 5.5.2.7 | Ensure system accounts do not have a valid login shell
    exec: "/awk -F: '$3<1000' /etc/passwd | egrep -wv 'root' | cut -d: -f1 | xargs -I '{}' passwd -S '{}' | egrep -cvw 'LK|L'/"
    exit-status: 1
    stdout:
    - '0'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.7
      NIST800-53R5:
      - AC-2(5)
      - AC-3
      - AC-11
      - MP-2
  {{ end }}
{{ end }}
