---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_2_2 }}
command:
  gid_0_accounts_check:
    title: 5.5.2.2 | Ensure root is the only GID 0 account
    exit-status: 0
    exec: |
      awk -F: '($1 !~ /^(sync|shutdown|halt|operator)$/ && $4 == 0) { print $1 }' /etc/passwd | grep -wv root || true
    stdout: []
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.2
      NIST800-53R5:
      - CM-6
      - IA-5
  {{ end }}
{{ end }}
