---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_2_6 }}
file:
  root_bash_profile:
    title: 5.5.2.6 | Ensure root user umask is configured
    path: /root/.bash_profile
    exists: true
    contents:
    - '/^\s+umask\s0(2|7)(2|7)/'
    - '!/^\s+umask\s[1-7][0-7][0-7]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.6
      NIST800-53R5:
      - AC-3
      - MP-2
  root_bashrc:
    title: 5.5.2.6 | Ensure root user umask is configured
    path: /root/.bashrc
    exists: true
    contents:
    - '/^\s+umask\s0(2|7)(2|7)/'
    - '!/^\s+umask\s[1-7][0-7][0-7]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.2.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
