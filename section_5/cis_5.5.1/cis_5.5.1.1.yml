---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_1_1 }}
file:
  login_passwd_expire:
    title: 5.5.1.1 | Ensure password expiration is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_MAX_DAYS\s+{{ .Vars.amazon2cis_pass_max_days }}/'
    - '!/^PASS_MAX_DAYS\s+(36[6-9]|[4-9][0-9][0-9]|[1-9][0-9][0-9][0-9]|[1-9][0-9][0-9][0-9][0-9])/'
    - '!/^PASS_MAX_DAYS\s+-1/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.1.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
