---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_1_5 }}
command:
  inactive_passwd:
    title: 5.5.1.5 | Ensure inactive password lock is configured | password
    exec: useradd -D | grep INACTIVE
    exit-status: 0
    stdout:
    - '/^INACTIVE=[1-30]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.1.5
  inactive_users:
    title: 5.5.1.5 | Ensure inactive password lock is configured | users
    exec: 'grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7'
    stdout:
    - '!/./'
    exit-status: 0
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.1.5
  {{ end }}
{{ end }}
