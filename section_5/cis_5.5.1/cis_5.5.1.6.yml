---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_1_6 }}
command:
  passwd_chg_past:
    title: 5.5.1.6 | Ensure all users last password change date is in the past
    exec: 'for usr in `cut -d: -f1 /etc/shadow`; do [ "$(date --date="$(chage --list $usr | grep "^Last password change" | cut -d: -f2)" +%s)" -gt "$(date "+%s")" ] && echo "Failed" ; done'
    exit-status: 1
    stdout:
    - '!Failed'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.1.6
  {{ end }}
{{ end }}
