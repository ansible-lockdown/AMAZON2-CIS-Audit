---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_5_1_3 }}
file:
  login_expire_warn:
    title: 5.5.1.3 | Ensure password expiration warning days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_WARN_AGE\s*{{ .Vars.amazon2cis_pass_warn_age }}/'
    - '!/^PASS_WARN_AGE\s*[1-6]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
