---

{{ if .Vars.amazon2cis_level_1}}
  {{ if .Vars.amazon2cis_rule_5_5_3_2 }}
file:
  /etc/profile.d/tmout.sh:
    title: 5.5.3.2 | Ensure default user shell timeout is configured | profile.d
    exists: true
    contents:
    - '/TMOUT=([1-8][0-9]{0,2}|900)/'
    - '/readonly TMOUT/'
    - '/export TMOUT/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.5.3.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
