---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_4_2 }}
file:
  remember_pamunix_system_auth:
    title: 5.4.2.4.2 | Ensure pam_unix does not include remember | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '!/^(auth|account|password|session)\s*(requisite|required|sufficient)\s*pam_unix.*remember=/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.4.2
      NIST800-53R5:
      - NA
  remember_pamunix_password_auth:
    title: 5.4.2.4.2 | Ensure pam_unix does not include remember | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '!/^(auth|account|password|session)\s*(requisite|required|sufficient)\s*pam_unix.*remember=/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.4.2
      NIST800-53R5:
      - NA
  {{ end }}
{{ end }}
