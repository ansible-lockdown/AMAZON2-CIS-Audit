---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_1_1 }}
command:
  pam_latest:
    title: 5.4.1.1 | Ensure latest version of pam is installed
    exec: yum update pam
    exit-status: 0
    stdout:
    - '/^No packages marked for update/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.1.1
      - NA
      NIST800-53R5: NA
  {{ end }}
{{ end }}
