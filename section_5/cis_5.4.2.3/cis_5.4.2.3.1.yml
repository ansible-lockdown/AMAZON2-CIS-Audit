---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_3_1 }}
file:
  pwhistory_system_auth:
    title: 5.4.2.3.1 | Ensure pam_pwhistory module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^password\s+required\s+pam_pwhistory.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.3.1
      NIST800-53R5:
      - IA-5
  pwhistory_password_auth:
    title: 5.4.2.3.1 | Ensure pam_pwhistory module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^password\s+required\s+pam_pwhistory.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.3.1
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
