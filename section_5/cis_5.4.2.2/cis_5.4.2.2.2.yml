---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_2_2 }}
file:
  difok_pwquality:
    title: 5.4.2.2.2 | Ensure password number of changed characters is configured
    path: /etc/security/pwquality.conf
    exists: true
    contents:
    - '/^difok\s*=\s*([2-9]|[1-9][0-9]+)\b/'
    - '!/^difok\s*=\s*[0-1]\b/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.2.2
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
