---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_2_1 }}
file:
  pwquality_system_auth:
    title: 5.4.2.2.1 | Ensure pam_pwquality module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^password\s+requisite\s+pam_pwquality.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.2.1
      NIST800-53R5:
      - IA-5
  pwquality_password_auth:
    title: 5.4.2.2.1 | Ensure pam_pwquality module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^password\s+requisite\s+pam_pwquality.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.2.1
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
