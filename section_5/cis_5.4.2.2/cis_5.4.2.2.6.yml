---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_2_6 }}
file:
  dickchk_pwquality:
    title: 5.4.2.2.6 | Ensure password dictionary check is enabled
    path: /etc/security/pwquality.conf
    exists: true
    contents:
    - '!/^dictcheck\s*=\s*0\b/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.2.6
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
