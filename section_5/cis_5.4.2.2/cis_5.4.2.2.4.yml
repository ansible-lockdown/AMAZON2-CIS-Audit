---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_4_2_2_4 }}
file:
  complex_pwquality:
    title: 5.4.2.2.4 | Ensure password complexity is configured
    path: /etc/security/pwquality.conf
    exists: true
    contents:
    {{ if .Vars.amazon2cis_pwquality_minclass }}
    - '/^minclass\s*=\s*([4-9])/'
    {{ end }}
    {{ if not .Vars.amazon2cis_pwquality_minclass }}
    - '/^dcredit\s*=\s*-1\b/'
    - '/^ucredit\s*=\s*-1\b/'
    - '/^ocredit\s*=\s*-1\b/'
    - '/^lcredit\s*=\s*-1\b/'
    {{ end }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.4.2.2.4
      NIST800-53R5:
      - IA-5
  {{ end }}
{{ end }}
