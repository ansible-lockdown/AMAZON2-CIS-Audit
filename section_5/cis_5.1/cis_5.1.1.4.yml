---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_4_1_1_4 }}
file:
  /etc/cron.daily:
    title: 4.1.1.4 | Ensure permissions on /etc/cron.daily are configured
    path: /etc/cron.daily
    exists: true
    owner: root
    group: root
    mode: '0700'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.1.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
