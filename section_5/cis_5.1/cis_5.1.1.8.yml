---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_1_1_8 }}
file:
  /etc/cron.deny:
    title: 5.1.1.8 | Ensure access to crontab is configured
    path: /etc/cron.deny
    exists: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.1.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  /etc/cron.allow:
    title: 5.1.1.8 | Ensure access to crontab is configured
    path: /etc/cron.allow
    exists: true
    owner: root
    group: root
    mode: '0600'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.1.1.8
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
