---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_5_3_4 }}
command:
  nopasswd_sudoers_d:
    title: 5.3.4 | Ensure users must provide password for escalation
    exec: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v ".*:#"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.3.4
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
