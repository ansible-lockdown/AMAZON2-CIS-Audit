---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_3_7 }}
file:
  su_restricted:
    title: 5.3.7 | Ensure access to the su command is restricted
    path: /etc/pam.d/su
    exists: true
    contents:
      {{ if eq .Vars.amazon2cis_sugroup "wheel" }}
      - '/^auth\s+required\s+pam_wheel.so\suse_uid/'
      {{ else }}
      - '/^auth\s+required\s+pam_wheel.so\suse_uid\sgroup={{ .Vars.amazon2cis_sugroup }}/'
      {{ end }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.7
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
