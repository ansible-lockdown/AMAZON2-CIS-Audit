---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_5_2_4_7 }}
command:
  audit_conf_group:
    title: 5.2.4.7 | Ensure audit configuration files belong to group root
    exec: for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    exit-status: 0
    stdout:
    - '/.*_root$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.2.4.7
      NIST800-53R5: NA
  {{ end }}
{{ end }}
