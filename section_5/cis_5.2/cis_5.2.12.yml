---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_12 }}
file:
  sshd_kex:
    title: 5.2.12 | Ensure sshd KexAlgorithms is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.12
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
