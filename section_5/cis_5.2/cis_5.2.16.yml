---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_16 }}
file:
  sshd_maxtries:
    title: 5.2.16 | Ensure sshd MaxAuthTries is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)MaxAuthTries [1-4]/'
    - '!/^(?i)MaxAuthTries (0|[5-9])/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.16
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
