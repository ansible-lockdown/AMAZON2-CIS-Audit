---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_14 }}
file:
  sshd_loglevel:
    title: 5.2.14 | Ensure sshd LogLevel is configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)LogLevel (VERBOSE|INFO)/'
    - '!/^(?i)LogLevel DEBUG/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.14
      NIST800-53R5:
      - AU-3
      - AU-12
      - SI-5
 {{ end }}
{{ end }}
