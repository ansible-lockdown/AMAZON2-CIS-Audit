---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_6 }}
file:
  sshd_ciphers:
    title: 5.2.6 | Ensure sshd Ciphers are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
