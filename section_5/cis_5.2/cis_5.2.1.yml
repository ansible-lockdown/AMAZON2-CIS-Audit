---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_1 }}
file:
  sshd_config_perms:
    title: 5.2.1 | Ensure access to /etc/ssh/sshd_config is configured
    path: /etc/ssh/sshd_config
    exists: true
    mode: '0600'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
