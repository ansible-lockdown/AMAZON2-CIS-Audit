---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_19 }}
file:
  sshd_empty_passwds:
    title: 5.2.19 | Ensure sshd PermitEmptyPasswords is disabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)PermitEmptyPasswords no/'
    - '!/^(?i)PermitEmptyPasswords yes/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.19
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
