---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_4_2_7 }}
file:
  sshd_clientmax_alive:
    title: 4.2.7 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^ClientAliveInterval {{ .Vars.amazon2cis_sshd_clientaliveinterval }}/'
    - '/^ClientAliveCountMax {{ .Vars.amazon2cis_sshd_clientalivecountmax }}/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.2.7
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
