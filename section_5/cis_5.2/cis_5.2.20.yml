---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_20 }}
file:
  sshd_rootlogin:
    title: 5.2.20 | Ensure sshd PermitRootLogin is disabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)PermitRootLogin no/'
    - '!/^(?i)PermitRootLogin yes/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.20
      NIST800-53R5:
      - AC-5
  {{ end }}
{{ end }}
