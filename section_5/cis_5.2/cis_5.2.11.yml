---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_5_2_11 }}
file:
  sshd_ignorerhosts:
    title: 5.2.11 | Ensure sshd IgnoreRhosts is enabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^(?i)IgnoreRhosts yes/'
    - '!/^(?i)IgnoreRhosts no/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
