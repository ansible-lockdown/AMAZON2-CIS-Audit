---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_5_2_8 }}
file:
  sshd_forwarding:
    title: 5.2.8 | Ensure sshd DisableForwarding is enabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^DisableForwarding yes/'
    - '!/^DisableForwarding no/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.8
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
