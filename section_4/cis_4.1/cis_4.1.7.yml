---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_4_1_7 }}
command:
  fwd_svcs_and_ports_configured:
    title: 4.1.7 | Ensure firewalld services and ports are configured
    exit-status: 0
    exec: firewall-cmd --list-all --zone="{{ .Vars.amazon2cis_active_firewall_zone }}"
    stdout:
    - '/services:/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 4.1.7
      NIST800-53R5:
      - CA-9
  {{ end }}
{{ end }}
