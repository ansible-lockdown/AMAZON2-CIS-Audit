---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_4_1_3 }}
command:
  fwd_nic_assigned_zone:
    title: 4.1.3 | Ensure network interface zone is configured
    exit-status: 0
    exec: |
      for netint in $(find /sys/class/net/* -maxdepth 1 | awk -F"/" '{print $NF}'); do
        [ "$netint" = "lo" ] && continue
        firewall-cmd --get-zone-of-interface="$netint" >/dev/null 2>&1 || echo "$netint"
      done
    stdout: []
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 4.1.3
      NIST800-53R5:
      - CA-9
  {{ end }}
{{ end }}
