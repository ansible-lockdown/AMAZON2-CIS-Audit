---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_4_2_15 }}
file:
  sshd_macs:
    title: 4.2.15 | Ensure sshd MACs are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.2.15
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
