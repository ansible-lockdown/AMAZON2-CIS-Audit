---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_4_2_4 }}
command:
  sshd_access_limited:
    title: 4.2.4 | Ensure sshd access is configured
    exec: grep -Ei "^(Allow|Deny)(Users|Groups)" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)AllowUsers: {{ .Vars.amazon2cis_sshd_allowusers }}/'
    - '/(?i)AllowGroups: {{ .Vars.amazon2cis_sshd_allowgroups }}/'
    - '/(?i)DenyUsers: {{ .Vars.amazon2cis_sshd_denyusers }}/'
    - '/(?i)DenyGroups: {{ .Vars.amazon2cis_sshd_denygroups }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
