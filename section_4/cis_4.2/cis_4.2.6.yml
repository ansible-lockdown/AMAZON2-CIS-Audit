---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_4_2_6 }}
file:
  sshd_ciphers:
    title: 4.2.6 | Ensure sshd Ciphers are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - {{ .Vars.amazon2cis_sshd.ciphers }}
    {{ range .Vars.amazon2cis_ssh_weak_ciphers }}
    - '!/{{ . }}/'
    {{ end }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.2.6
      NIST800-53R5:
      - SC-8
  {{ end }}
{{ end }}
