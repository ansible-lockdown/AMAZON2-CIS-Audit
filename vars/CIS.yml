####
## Section 3
####
# Section 3 Variables
# 3.1.x
# IPv6 required
amazon2cis_ipv6_required: false
amazon2cis_ipv6_sysctl_force: true
amazon2cis_ipv6_sysctl_file: /etc/sysctl.d/60-ipv6.conf
# Setting this will stop ipv6 listening on ::1 and will remove from /etc/hosts
amazon2cis_ipv6_disable_localhost: false

# service = true removes package - mask = true will just mask package
amazon2cis_bluetooth_service: true
amazon2cis_bluetooth_mask: false

# 3.3.x
# System network parameters (host only OR host and router)
amazon2cis_is_router: false
amazon2cis_ipv4_sysctl_file: /etc/sysctl.d/60-ipv4.conf

# Firewall Service - either firewalld, iptables or nftables
# multiple options for removal or masking of services
# The firewall to be configured
amazon2cis_system_firewall: firewalld
# Set the following to remove or mask - note will not effect system_firewall # set to none
amazon2cis_nftables: mask
amazon2cis_iptables: mask
amazon2cis_firewalld: none

amazon2cis_firewall_interface:
- eth0

# 4.1.3 - 4.1.6 firewalld zone the system interfaces are assigned to
amazon2cis_active_firewall_zone: public

# Used by some Goss tests (align with amazon2cis_system_firewall)
amazon2cis_firewall: firewalld
amazon2cis_iptables_boot_config: false
amazon2cis_ip6tables_boot_config: false

####
## Section 4 Variables
####

# SSH variables

## Can be VERBOSE or INFO
amazon2cis_ssh_loglevel: INFO
# amazon2cis_ssh_maxsessions is the max number of sessions
# To conform to CIS standards this value nees to be 10 or less

amazon2cis_sshd_clientalivecountmax: 3
# clientaliveinterval should be between 1 and 900
amazon2cis_sshd_clientaliveinterval: 15
amazon2cis_sshd_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
amazon2cis_sshd_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
amazon2cis_sshd_kex: "curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256"

# Note the following to understand precedence and layout
amazon2cis_sshd_allowusers: vagrant
amazon2cis_sshd_allowgroups:
amazon2cis_sshd_denyusers: nobody
amazon2cis_sshd_denygroups:

## Sudo

# Group to be used for su
# this group needs to exists groups will not be created for remediation this is considered sys admins

amazon2cis_sugroup: wheel

amazon2cis_pwquality_minclass: true

# Used by Goss tests (align with amazon2cis_pass)
amazon2cis_pass_max_days: 365
amazon2cis_pass_min_days: 1
amazon2cis_pass_warn_age: 7

####
## Section 5 Variables
####

# Preferred method of logging
# Whether rsyslog or journald preferred method for local logging
amazon2cis_syslog: rsyslog
amazon2cis_rsyslog_ansiblemanaged: true
# Set if system is the log server
amazon2cis_system_is_log_server: false

# AuditD

# auditd settings
amazon2cis_auditd_max_log_file_action: keep_logs

# AIDE
amazon2cis_config_aide: true

# aide setup via - cron, timer
amazon2cis_aide_scan: cron

