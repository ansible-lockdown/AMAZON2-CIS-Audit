---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_3_2 }}
mount:
  home_options:
    title: 1.1.2.3.2 | Ensure nodev option set on /home partition
    mountpoint: /home
    exists: true
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.3.2
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  home_fstab_options:
     title: 1.1.2.3.2 | Ensure nodev option set on /home partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/home.*nodev/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.3.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
