---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_7_2 }}
mount:
  var_log_audit_nodev_option:
    title: |
      1.1.2.7.2 | Ensure nodev option set on /var/log/audit partition
    mountpoint: '/var/log/audit'
    exists: true
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.2
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  var_log_audit_fstab_nodev_option:
     title: 1.1.2.7.2 | Ensure nodev option set on /var/log/audit partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/var\/log\/audit\s.*nodev/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
