---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_2_3 }}
mount:
  dev_shm_options:
    title: 1.1.2.2.3 | Ensure nosuid option set on /dev/shm partition
    mountpoint: /dev/shm
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.2.3
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  dev_shm_fstab_options:
     title: 1.1.2.2.3 | Ensure nosuid option set on /dev/shm partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/dev\/shm.*nosuid/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.2.3
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
