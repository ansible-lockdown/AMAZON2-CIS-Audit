---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_7_4 }}
mount:
  var_log_audit_options_noexec:
    title: 1.1.2.7.4 | Ensure noexec option set on /var/log/audit partition
    mountpoint: '/var/log/audit'
    exists: true
    opts:
    - noexec
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.4
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  var_log_audit_fstab_options_noexec:
     title: 1.1.2.7.4 | Ensure noexec option set on /var/log/audit partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/var\/log\/audit\s.*noexec/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
