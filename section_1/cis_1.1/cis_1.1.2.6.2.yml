---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_6_2 }}
mount:
  var_log_options_nodev:
    title: 1.1.2.6.2 | Ensure nodev option set on /var/log partition
    mountpoint: '/var/log'
    exists: true
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.6.2
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  var_log_fstab_options_nodev:
     title: 1.1.2.6.2 | Ensure nodev option set on /var/log partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/var\/log\s.*nodev/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.6.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
