---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_1_4 }}
mount:
  tmp_noexec_option:
    title: 1.1.2.1.4 | Ensure noexec option set on /tmp partition
    mountpoint: /tmp
    exists: true
    opts:
    - noexec
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  tmp_fstab_noexec_option:
     title: 1.1.2.1.4 | Ensure noexec option set on /tmp partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/tmp.*noexec/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
