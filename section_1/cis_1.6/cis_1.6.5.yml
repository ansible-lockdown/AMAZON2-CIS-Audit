file:
  {{ if .Vars.amazon2cis_rule_1_6_5 }}
  etc_issue:
    title: 1.6.5 | Ensure permissions on /etc/issue are configured
    path: /etc/issue
    exists: true
    mode: '0644'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.5
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
