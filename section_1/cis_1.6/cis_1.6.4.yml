---

{{ if .Vars.amazon2cis_level_1 }}
file:
  {{ if .Vars.amazon2cis_rule_1_6_4 }}
  motd:
    title: 1.6.4 | Ensure access to /etc/motd is configured
    path: /etc/motd
    exists: true
    mode: '0644'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
