---

{{ if .Vars.amazon2cis_level_1 }}
file:
  {{ if .Vars.amazon2cis_rule_1_6_2 }}
  etc_issue:
    title: 1.6.2 | Ensure local login warning banner is configured properly
    path: /etc/issue
    exists: true
    mode: '0644'
    owner: root
    group: root
    contents:
    - '!/(?i)(amazon|centos|fedora|redhat|linux)/'
    - '!/x86_64/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.2
      - 1.6.5
      - 4.8
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
{{ end }}
