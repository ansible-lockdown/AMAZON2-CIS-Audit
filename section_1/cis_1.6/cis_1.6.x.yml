---

{{ if .Vars.amazon2cis_level_1 }}
file:
  {{ if .Vars.amazon2cis_rule_1_6_1 }}
  motd:
    title: 1.6.1 | Ensure message of the day is configured properly
    path: /etc/motd
    exists: true
    mode: '0644'
    owner: root
    group: root
    contents:
    - '!/(?i)(amazon|centos|fedora|redhat|linux)/'
    - '!/x86_64/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.1
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
  {{ if .Vars.amazon2cis_rule_1_6_2 }}
  etc_issue:
    title: 1.6.2 | Ensure local login warning banner is configured properly
    path: /etc/issue
    exists: true
    mode: '0644'
    owner: root
    group: root
    contents:
    - '!/(?i)(amazon|centos|fedora|redhat|linux)/'
    - '!/x86_64/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.2
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
  {{ if .Vars.amazon2cis_rule_1_6_3 }}
  etc_issue.net:
    title: 1.6.3 | Ensure remote login warning banner is configured properly
    path: /etc/issue.net
    exists: true
    mode: '0644'
    owner: root
    group: root
    contents:
    - '!/(?i)(amazon|centos|fedora|redhat|linux)/'
    - '!/x86_64/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.3
      NIST800-53R5:
      - CM-1
      - CM-3
      - CM-6
  {{ end }}
  {{ if .Vars.amazon2cis_rule_1_6_4 }}
  motd:
    title: 1.6.4 | Ensure access to /etc/motd is configured
    path: /etc/motd
    exists: true
    mode: '0644'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
  {{ if .Vars.amazon2cis_rule_1_6_5 }}
  etc_issue:
    title: 1.6.5 | Ensure access to /etc/issue is configured
    path: /etc/issue
    exists: true
    mode: '0644'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.5
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
  {{ if .Vars.amazon2cis_rule_1_6_6 }}
  etc_issue.net:
    title: 1.6.6 | Ensure access to /etc/issue.net is configured
    path: /etc/issue.net
    exists: true
    mode: '0644'
    owner: root
    group: root
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.6
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
