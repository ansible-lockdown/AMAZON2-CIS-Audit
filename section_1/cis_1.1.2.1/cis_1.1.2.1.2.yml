---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_2_1_2 }}
mount:
  tmp_nodev_option:
    title: 1.1.2.1.2 | Ensure nodev option set on /tmp partition
    mountpoint: /tmp
    exists: true
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  tmp_fstab_nodev_option:
     title: 1.1.2.1.2 | Ensure nodev option set on /tmp partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/tmp.*nodev/'
     meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
