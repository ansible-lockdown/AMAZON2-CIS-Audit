---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_5_7 }}
kernel-param:
  ptrace_scope:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | sysctl_live
    name: kernel.yama.ptrace_scope
    value: '1'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.5.7
      NIST800-53R5:
      - CM-6
      - CM-6b
command:
  ptrace_scope_conf:
    title: 1.5.7 | Ensure kernel.yama.ptrace_scope is configured | sysctl_configured
    exit-status:
      or:
      - 0
      - 1
    exec: 'grep -h "kernel\.yama\.ptrace_scope" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^kernel.yama.ptrace_scope\s*=\s*1/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.5.7
      NIST800-53R5:
      - CM-6
      - CM-6b
  {{ end }}
{{ end }}
