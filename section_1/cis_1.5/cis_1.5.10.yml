---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_5_10 }}
file:
  core_dumps_storage:
    title: 1.5.10 | Ensure systemd-coredump Storage is configured | security/limits.conf
    path: /etc/systemd/coredump.conf
    exists: true
    contents:
    - '/^Storage\s*=\s*none/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.5.10
      NIST800-53R5:
  {{ end }}
{{ end }}
