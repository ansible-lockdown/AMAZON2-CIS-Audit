---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_5_8 }}
kernel-param:
  kernel.randomize_va_space:
    title: 1.5.8 | Ensure kernel.randomize_va_space is configured | sysctl_live
    value: '2'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.5.8
      NIST800-53R5:
      - CM-6
      - CM-6b
command:
  aslr_enabled_2:
    title: 1.5.8 | Ensure kernel.randomize_va_space is configured | sysctl_configured
    exit-status:
      or:
      - 0
      - 1
    exec: 'grep -h "kernel\.randomize_va_space" /etc/sysctl.conf /etc/sysctl.d/*'
    stdout:
    - '/^kernel.randomize_va_space=2/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.5.8
      NIST800-53R5:
      - CM-6
      - CM-6b
  {{ end }}
{{ end }}
