---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_4_3 }}
file:
  core_dumps_procsizemax:
    title: 1.4.3 | Ensure core dumps are restricted | security/limits.conf
    path: /etc/systemd/coredump.conf
    exists: true
    contents:
    - '/^ProcessSizeMax\s*=\s*0/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.4.3
      NIST800-53R5:
      - CM-6b
  {{ end }}
{{ end }}
