---

{{ if not .Vars.amazon2cis_selinux_disable }}
  {{ if .Vars.amazon2cis_level_1 }}
    {{ if  .Vars.amazon2cis_rule_1_4_1_4 }}
command:
   selinux_running_mode:
    title: 1.4.1.4 | Ensure the SELinux mode is not disabled | running
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '!/[Dd]isabled/'
    - '/(Enforcing|Permissive)/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.4.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  selinux_state_config:
    title: 1.4.1.4 | Ensure the SELinux mode is not disabled | config
    exists: true
    path: /etc/selinux/config
    contents:
    - '/SELINUX=(enforcing|permissive)/'
    - '!/^SELINUX\s*=\s*disabled/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.4.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
