---

{{ if not .Vars.amazon2cis_selinux_disable }}
  {{ if .Vars.amazon2cis_level_2 }}
    {{ if .Vars.amazon2cis_rule_1_4_1_6 }}
command:
  selinux_unconfined:
    title: 1.4.1.6 | Ensure no unconfined services exist
    exit-status:
      or:
      - 0
      - 1
    exec: "ps -eZ | grep unconfined_service_t"
    stdout: ['!/./']
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.4.1.6
      NIST800-53R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
