---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_run_heavy_tests }}
    {{ if .Vars.amazon2cis_rule_1_2_4 }}
command:
  repos_configured:
    title: 1.2.4 | Ensure package manager repositories are configured
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    exec: "yum repolist"
    stdout:
    - '/amzn2-core\/2\/x86_64/'
    - '/amzn2extra-docker\/2\/x86_64/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.4
      NIST800-53R5:
      - SI-2
    {{ end }}
  {{ end }}
{{ end }}
