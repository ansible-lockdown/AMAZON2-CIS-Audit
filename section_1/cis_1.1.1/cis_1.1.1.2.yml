---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_1_1_1_2 }}
command:
  hfs_modprobe:
    title: 1.1.1.2 | Ensure hfs kernel module is not available
    exit-status: 0
    exec: grep -Rh -w hfs /etc/modprobe.d/
    stdout:
    - '/install hfs /bin/(false|true)/'
    - '/blacklist hfs/'
    meta:
      server: 1
      workstation: NA
      CIS_ID: 1.1.1.2
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
