---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_1_3 }}
command:
  boot_audit_backlog:
    title: 6.2.1.3 | Ensure audit_backlog_limit is sufficient | grubenv
    exec: grep "audit_backlog_limit=" /boot/grub2/grub.cfg
    exit-status: 0
    stdout:
    - '/^\s*linux /boot/vmlinuz-..*\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.1.3
      NIST800-53R5:
      - AU-2
      - AU-12
      - SI-5
  default_audit_backlog:
    title: 6.2.1.3 | Ensure audit_backlog_limit is sufficient | default
    exec: grep "audit_backlog_limit=" /etc/default/grub
    exit-status: 0
    stdout:
    - '/^GRUB_CMDLINE_LINUX_DEFAULT=.*\saudit_backlog_limit=(8192|819[3-9]|8[2-9]{,2}|9[0-9]{3,9}|[1-9]{5,9}).*/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.1.3
      NIST800-53R5:
      - AU-2
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
