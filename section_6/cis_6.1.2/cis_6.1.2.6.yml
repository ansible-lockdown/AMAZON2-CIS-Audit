---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_2_6 }}
command:
  local_syslog_module_new:
    title: 6.1.2.6 | Ensure rsyslog is not configured to receive logs from a remote client
    exec: grep -P -- '^\h*(module|input)\((load|type)="imtcp".*\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.6
      NIST800-53R5: NA
  local_syslog_input_old:
    title: 6.1.2.6 | Ensure rsyslog is not configured to receive logs from a remote client
    exec: grep -P -- '^\h*input\(type="imtcp" port="514"\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.6
      NIST800-53R5: NA
  {{ end }}
{{ end }}
