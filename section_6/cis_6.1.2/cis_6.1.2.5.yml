---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_2_5 }}
command:
  remote_syslog:
    title: 6.1.2.5 | Ensure rsyslog is configured to send logs to a remote log host
    exec: 'grep -E "action.*omfwd.*target" /etc/rsyslog.conf /etc/rsyslog.d/*.conf'
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '*.* action(type="omfwd" target="loghost.example.com" port="514"'
    - protocol="tcp"
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.5
      NIST800-53R5: NA
  {{ end }}
{{ end }}
