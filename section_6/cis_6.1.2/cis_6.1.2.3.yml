---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_2_3 }}
command:
  perms_rsyslog_d:
    title: 6.1.2.3 | Ensure rsyslog log file creation mode is configured
    exec: 'grep -s ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf | cut -f2 -d:'
    exit-status: 0
    stdout:
    - '/\$FileCreateMode 06[0-4]0/'
    - '!/\$FileCreateMode 06[6-7][0-7]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
