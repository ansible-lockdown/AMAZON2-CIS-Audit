---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_3_21 }}
command:
  auditd_immutable:
    title: 6.2.3.21 | Ensure the audit configuration is immutable
    exec: 'grep "-e 2" /etc/audit/rules.d/*.rules | tail -1'
    exit-status: 0
    stdout:
    - '-e 2'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.21
      NIST800-53R5:
      - AC-3
      - AU-3
      - MP-2
  {{ end }}
{{ end }}
