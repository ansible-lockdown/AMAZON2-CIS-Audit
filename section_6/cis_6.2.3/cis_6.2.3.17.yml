---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_3_17 }}
command:
  auditd_chacl_cnf:
    title: 6.2.3.17 | Ensure successful and unsuccessful attempts to use the chacl command are collected | config
    exec: grep chacl /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^.*rules:-a always,exit -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=(unset|4294967295) -k perm_chng/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5: NA
  auditd_chacl_live:
    title: 6.2.3.17 | Ensure successful and unsuccessful attempts to use the chacl command are collected | running
    exec: auditctl -l | grep chacl
    exit-status: 0
    stdout:
    - '/^-a always,exit -S all -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=-1 -F key=perm_chng/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.17
      NIST800-53R5: NA
  {{ end }}
{{ end }}
