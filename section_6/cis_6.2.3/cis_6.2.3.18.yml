---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_3_18 }}
command:
  auditd_usermod_cnf:
    title: 6.2.3.18 | Ensure successful and unsuccessful attempts to use the usermod command are collected | config
    exec: grep usermod /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^.*rules:-a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=(unset|4294967295) -k usermod/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.18
      NIST800-53R5: NA
  auditd_usermod_live:
    title: 6.2.3.18 | Ensure successful and unsuccessful attempts to use the usermod command are collected | running
    exec: auditctl -l | grep usermod
    exit-status: 0
    stdout:
    - '/^-a always,exit -S all -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=-1 -F key=usermod/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.18
      NIST800-53R5: NA
  {{ end }}
{{ end }}
