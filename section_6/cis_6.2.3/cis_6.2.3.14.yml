---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_3_14 }}
command:
  auditd_MAC_cnf:
    title: 6.2.3.14 | Ensure events that modify the system's Mandatory Access Controls are collected
    exec: grep MAC-policy /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^.*rules:-w /etc/selinux/ -p wa -k MAC-policy/'
    - '/^.*rules:-w /usr/share/selinux/ -p wa -k MAC-policy/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.14
      NIST800-53R5: NA
  auditd_MAC_live:
    title: 6.2.3.14 | Ensure events that modify the system's Mandatory Access Controls are collected
    exec: auditctl -l | grep MAC-policy
    exit-status: 0
    stdout:
    - '/^-w /etc/selinux -p wa -k MAC-policy/'
    - '/^-w /usr/share/selinux -p wa -k MAC-policy/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.14
      NIST800-53R5: NA
  {{ end }}
{{ end }}
