---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_1_3 }}
command:
  journald_compress:
    title: 6.1.1.3 | Ensure journald Compress is configured
    exec: grep -i "compress" /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^Compress=yes/'
    - '/!Compress=[Nn][Oo]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
