---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_1_6 }}
command:
  journald_log_rotation:
    title: 6.1.1.6 | Ensure journald log file rotation is configured
    exec: grep -Ei "(MaxFileSec|KeepFree|MaxUse)" /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^#.*F/'
    - '/^SystemMaxUse=/'
    - '/^SystemKeepFree=/'
    - '/^RuntimeMaxUse=/'
    - '/^RuntimeKeepFree=/'
    - '/^MaxFileSec=/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.6
      NIST800-53R5: NA
  {{ end }}
{{ end }}
