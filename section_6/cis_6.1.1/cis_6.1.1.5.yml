---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_1_5 }}
command:
  journald_forwardtosyslog:
    title: 6.1.1.5 | Ensure journald ForwardToSyslog is configured
    exec: grep -i "ForwardToSyslog" /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^#.*ForwardToSyslog=/'
    - '!/^\s*ForwardToSyslog/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.5
      NIST800-53R5: NA
  {{ end }}
{{ end }}
