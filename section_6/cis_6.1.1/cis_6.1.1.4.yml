---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_1_4 }}
command:
  journald_storage:
    title: 6.1.1.4 | Ensure journald Storage is configured
    exec: grep -i "storage" /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^Storage=persistent/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.4
      NIST800-53R5: NA
  {{ end }}
{{ end }}
