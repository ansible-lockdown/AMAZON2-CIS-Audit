---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_1_2 }}
service:
  systemd-journal-remote.stopped:
    title: 6.1.1.2 | Ensure systemd-journal-remote service is not in use
    name: systemd-journal-remote.socket
    running: false
    enabled: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.2
      NIST800-53R5: NA
command:
  journald_socket_masked:
    title: 6.1.1.2 | Ensure systemd-journal-remote service is not in use
    exec: systemctl is-enabled systemd-journal-remote.socket
    exit-status: 1
    stdout:
    - '/^masked/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.1.2
  {{ end }}
{{ end }}
