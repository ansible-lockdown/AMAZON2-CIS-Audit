---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_2_4 }}
file:
  auditd_space_left:
    title: 6.2.2.4 | Ensure system warns when audit logs are low on space
    path: /etc/audit/auditd.conf
    exists: true
    contents:
    - '/^space_left_action\s*=\s*(email|exec|single|halt)/'
    - '/^admin_space_left_action\s*=\s*(single|halt)/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.2.4
      NIST800-53R5:
      - AU-2
      - AU-3
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
