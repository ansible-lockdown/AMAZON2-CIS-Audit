---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_2_3 }}
file:
  auditd_disable_full:
    title: 6.2.2.3 | Ensure system is disabled when audit logs are full
    path: /etc/audit/auditd.conf
    exists: true
    contents:
    - '/^disk_full_action = (halt|single)/'
    - '/^disk_error_action = (syslog|single|halt)/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.2.3
      NIST800-53R5:
      - AU-2
      - AU-3
      - AU-12
      - SI-5
  {{ end }}
{{ end }}
