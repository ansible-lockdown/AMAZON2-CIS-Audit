---

{{ if .Vars.amazon2cis_level_2 }}
  {{ if .Vars.amazon2cis_rule_6_2_4_4 }}
command:
  audit_logfile_group_setting:
    title: 6.2.4.4 | Ensure audit log files group owner is configured
    exec: grep log_group /etc/audit/audit* | awk '{ print $NF}'
    exit-status: 0
    stdout:
    - '/^(adm|root)$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5: NA
  audit_logfile_group:
    title: 6.2.4.4 | Ensure audit log files group owner is configured
    exec: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc " %n_%G" $file; done
    exit-status: 0
    stdout:
    - '/.*_(adm|root)$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.4.4
      NIST800-53R5: NA
  {{ end }}
{{ end }}
