---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_6_1_9 }}
file:
  /etc/shells_perms:
    title: 6.1.9 | Ensure permissions on /etc/shells are configured
    exists: true
    path: /etc/shells
    mode:
      or:
      - '0644'
      - '0640'
      - '0600'
      - '0400'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.9
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}

