---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_ipv6_required }}
    {{ if .Vars.amazon2cis_rule_3_3_11 }}
kernel-param:
  net.ipv6.conf.all.accept_ra:
    title: 3.3.11 | Ensure ipv6 router advertisements are not accepted
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
  net.ipv6.conf.default.accept_ra:
    title: 3.3.11 | Ensure ipv6 router advertisements are not accepted
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.11
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
    {{ end }}
  {{ end }}
{{ end }}
