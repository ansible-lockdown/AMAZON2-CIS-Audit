---

{{ if not .Vars.amazon2cis_is_router }}
  {{ if .Vars.amazon2cis_level_1 }}
    {{ if .Vars.amazon2cis_rule_3_3_1 }}
kernel-param:
  net.ipv4.ip_forward:
    title: 3.3.1 | Ensure ip forwarding is disabled
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
  {{ if .Vars.amazon2cis_ipv6_required }}
  net.ipv6.conf.all.forwarding:
    title: 3.3.1 | Ensure ip forwarding is disabled
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.1
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
