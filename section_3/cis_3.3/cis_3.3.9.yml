---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_3_3_9 }}
kernel-param:
  net.ipv4.conf.all.log_martians:
    title: 3.3.9 | Ensure suspicious packets are logged
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.9
      NIST800-53R5: AU-3
  net.ipv4.conf.default.log_martians:
    title: 3.3.9 | Ensure suspicious packets are logged
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.9
      NIST800-53R5: AU-3
  {{ end }}
{{ end }}
