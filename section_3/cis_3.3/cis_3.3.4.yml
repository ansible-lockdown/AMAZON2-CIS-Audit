  net.ipv4.icmp_echo_ignore_broadcasts:
    title: 3.3.4 | Ensure broadcast ICMP requests are ignored
    value: '1'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.4
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
