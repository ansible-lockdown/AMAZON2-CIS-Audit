---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_3_2_2 }}
command:
  modprobe_sctp:
    title: 3.2.2 | Ensure sctp kernel module is not available
    exit-status: 0
    exec: grep -Rh sctp /etc/modprobe.d/
    stdout:
    - '/install sctp /bin/(false|true)/'
    - '/blacklist sctp/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.2.2
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
