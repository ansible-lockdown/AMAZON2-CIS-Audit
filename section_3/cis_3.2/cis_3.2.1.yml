---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_3_2_1 }}
command:
  can_modprobe:
    title: 3.2.1 | Ensure can kernel module is not available
    exit-status: 0
    exec: grep -Rh can /etc/modprobe.d/
    stdout:
    - '/install can /bin/(false|true)/'
    - '/blacklist can/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.2.1
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
