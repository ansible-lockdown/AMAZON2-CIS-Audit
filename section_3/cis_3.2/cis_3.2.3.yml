---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_3_2_3 }}
command:
  modprobe_tipc:
    title: 3.2.3 | Ensure tipc kernel module is not available
    exit-status: 0
    exec: grep -Rh tipc /etc/modprobe.d/
    stdout:
    - '/install tipc /bin/(false|true)/'
    - '/blacklist tipc/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.2.3
      NIST800-53R5:
      - CM-7
      - SI-4
  {{ end }}
{{ end }}
