---

{{ if .Vars.amazon2cis_level_1 }}
  {{ if .Vars.amazon2cis_rule_3_3_6 }}
kernel-param:
  net.ipv4.conf.all.secure_redirects:
    title: 3.3.6 | Ensure secure icmp redirects are not accepted
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.6
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
  net.ipv4.conf.default.secure_redirects:
    title: 3.3.6 | Ensure secure icmp redirects are not accepted
    value: '0'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.3.6
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-5
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
